spring.application.name=mytingeso
server.port=8090

#conexion a mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3310/mytingeso_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=always
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwt-set-uri=${KEYCLOAK_JWT_SET_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}
